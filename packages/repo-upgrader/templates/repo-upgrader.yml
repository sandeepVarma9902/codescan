name: Repo Upgrader

on:
  workflow_dispatch:
    inputs:
      target:
        description: Migration target
        required: true
        default: vite
        type: choice
        options:
          - vite
          - nextjs
          - react-native
      delivery:
        description: Deliver converted code as a pull request or downloadable ZIP
        required: true
        default: pull-request
        type: choice
        options:
          - pull-request
          - download-zip

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate and verify
        uses: sandeepVarma9902/codescan/packages/repo-upgrader@main
        with:
          target: ${{ inputs.target }}
      - name: Open migration pull request
        if: ${{ inputs.delivery == 'pull-request' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: repo-upgrader/${{ inputs.target }}-${{ github.run_id }}
          commit-message: "modernize: migrate to ${{ inputs.target }}"
          title: "Modernize application to ${{ inputs.target }}"
          body: |
            Generated by Repo Upgrader using deterministic transformations.

            Review `repo-upgrader-report.json` for the scan, plan, changes, and verification evidence.
          delete-branch: true
      - name: Package migrated project
        if: ${{ inputs.delivery == 'download-zip' }}
        run: zip -qr "migrated-${{ inputs.target }}.zip" . -x '.git/*' 'node_modules/*' '.modernizer/*'
      - name: Provide migrated ZIP
        if: ${{ inputs.delivery == 'download-zip' }}
        uses: actions/upload-artifact@v4
        with:
          name: migrated-${{ inputs.target }}-${{ github.run_id }}
          path: migrated-${{ inputs.target }}.zip
          retention-days: 7

services:
  - type: web
    name: repo-upgrader-demo
    runtime: node
    plan: free
    rootDir: packages/repo-upgrader
    buildCommand: npm install --workspaces=false --package-lock=false
    startCommand: node bin/repo-upgrader.js serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: MODERNIZER_DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "22"

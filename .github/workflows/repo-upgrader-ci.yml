name: Repo Upgrader CI

on:
  pull_request:
    paths:
      - "packages/repo-upgrader/**"
      - ".github/workflows/repo-upgrader-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/repo-upgrader/**"
      - ".github/workflows/repo-upgrader-ci.yml"

permissions:
  contents: read

concurrency:
  group: repo-upgrader-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/repo-upgrader
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

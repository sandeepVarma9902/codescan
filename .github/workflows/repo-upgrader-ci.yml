name: Repo Upgrader CI

on:
  pull_request:
    paths:
      - "packages/repo-upgrader/**"
      - ".github/workflows/repo-upgrader-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/repo-upgrader/**"
      - ".github/workflows/repo-upgrader-ci.yml"

permissions:
  contents: read

concurrency:
  group: repo-upgrader-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/repo-upgrader
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/repo-upgrader/package-lock.json
      - name: Install locked dependencies
        run: npm ci --workspaces=false
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev
